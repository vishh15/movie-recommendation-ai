<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie Recommender{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- TailwindCSS Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            bg: '#020617',
                            surface: '#0f172a',
                            card: '#111827',
                        },
                        accent: {
                            red: '#ef4444',
                            purple: '#8b5cf6',
                            green: '#22c55e',
                        },
                        border: {
                            subtle: 'rgba(255,255,255,0.05)',
                            soft: 'rgba(255,255,255,0.1)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                        accent: ['Space Grotesk', 'monospace'],
                    },
                    backdropBlur: {
                        'xs': '2px',
                    }
                }
            }
        }
    </script>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-primary-bg text-gray-100 min-h-screen font-sans antialiased">
    <!-- Premium Navigation -->
    <nav class="fixed w-full z-50 bg-black/40 backdrop-blur-md border-b border-white/5">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <!-- Logo & Brand -->
                <a href="/" class="flex items-center space-x-3 group">
                    <div class="text-4xl transform group-hover:scale-110 transition-transform duration-300">🎬</div>
                    <div>
                        <div class="text-2xl font-display font-bold bg-gradient-to-r from-accent-red via-accent-purple to-accent-red bg-clip-text text-transparent tracking-tight">
                            MOVREC AI
                        </div>
                    </div>
                </a>
                
                <!-- Navigation Links -->
                <div class="flex items-center space-x-8">
                    <a href="/" class="nav-link text-gray-300 hover:text-white transition-all duration-300 relative group">
                        Home
                        <span class="nav-link-underline"></span>
                    </a>
                    <a href="/quiz" class="nav-link text-gray-300 hover:text-white transition-all duration-300 relative group">
                        Quiz
                        <span class="nav-link-underline"></span>
                    </a>
                    <a href="/camera" class="nav-link text-gray-300 hover:text-white transition-all duration-300 relative group">
                        Camera
                        <span class="nav-link-underline"></span>
                    </a>
                    <button id="theme-toggle" class="ml-4 p-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition-all duration-300">
                        <span class="text-xl">🌙</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="pt-20">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Premium Footer -->
    <footer class="bg-black/30 backdrop-blur-md border-t border-white/5 mt-32 py-12">
        <div class="container mx-auto px-6">
            <div class="text-center">
                <div class="flex items-center justify-center space-x-3 mb-4">
                    <div class="text-3xl">🎬</div>
                    <div class="text-xl font-display font-bold bg-gradient-to-r from-accent-red to-accent-purple bg-clip-text text-transparent">
                        MOVREC AI
                    </div>
                </div>
                <p class="text-gray-400 text-sm font-accent">
                    Powered by AI Emotion Detection • Built with PyTorch & Flask
                </p>
                <div class="mt-6 flex items-center justify-center space-x-6 text-xs text-gray-500">
                    <span>© 2024 Movie Recommender</span>
                    <span>•</span>
                    <span>TMDB Integration</span>
                    <span>•</span>
                    <span>Deep Learning AI</span>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
